<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GIS Map — PDISA-2 Lubango</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/styles.css" />

<style>
  .gis-layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: var(--sp-5);
    align-items: start;
  }

  @media (max-width: 992px) {
    .gis-layout {
      grid-template-columns: 1fr;
    }
  }

  .filter-group {
    margin-bottom: var(--sp-5);
  }

  .filter-group h4 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-muted);
    margin: 0 0 10px;
  }

  .filter-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 4px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
  }

  #gisMap {
    height: 620px;
    border-radius: var(--radius-md);
    z-index: 1;
  }

  .gis-popup strong {
    display: block;
    margin-bottom: 2px;
  }

  .legend-square {
    display: inline-block;
    width: 13px;
    height: 13px;
    border-radius: 3px;
  }
</style>
</head>

<body data-page="gis">

<script>
  window.WSDP_PAGE = {
    title: "GIS Map",
    breadcrumb: "PDISA-2 Lubango <span class=\"separator\">/</span> GIS Map",
    statusClass: "status-pill--warning",
    statusText: "Notional Delay: 6.5 months"
  };
</script>

<div class="app-shell">
  <aside class="sidebar" id="sidebarMount"></aside>

  <div class="main-column">
    <header class="topbar" id="topbarMount"></header>

    <main class="main-content">

      <div class="section-heading">
        <h2>GIS Map — 7 Intervention Areas (Lubango)</h2>
        <span class="section-sub">Pipeline corridor, work fronts and intervention areas</span>
      </div>

      <div class="gis-layout">

        <div class="card">
          <div class="card-body">

            <div class="filter-group">
              <h4>Status</h4>

              <label class="filter-chip">
                <input type="checkbox" class="gis-filter-status" data-status="complete" checked>
                <span class="legend-square" style="background:var(--color-success);"></span>
                Complete
              </label>

              <label class="filter-chip">
                <input type="checkbox" class="gis-filter-status" data-status="progress" checked>
                <span class="legend-square" style="background:var(--color-warning);"></span>
                In Progress
              </label>

              <label class="filter-chip">
                <input type="checkbox" class="gis-filter-status" data-status="mobilising" checked>
                <span class="legend-square" style="background:#F58232;"></span>
                Mobilising
              </label>

              <label class="filter-chip">
                <input type="checkbox" class="gis-filter-status" data-status="notStarted" checked>
                <span class="legend-square" style="background:var(--color-critical);"></span>
                Not Started
              </label>
            </div>

            <div class="filter-group">
              <h4>Intervention Areas</h4>

              <label class="filter-chip">
                <input type="checkbox" class="gis-filter-area" data-area="Mapunda" checked>
                Mapunda
              </label>

              <label class="filter-chip">
                <input type="checkbox" class="gis-filter-area" data-area="Nambambe" checked>
                Nambambe
              </label>

              <label class="filter-chip">
                <input type="checkbox" class="gis-filter-area" data-area="Bula Matadi" checked>
                Bula Matadi
              </label>

              <label class="filter-chip">
                <input type="checkbox" class="gis-filter-area" data-area="Lubango Central" checked>
                Lubango Central
              </label>

              <label class="filter-chip">
                <input type="checkbox" class="gis-filter-area" data-area="Comandante" checked>
                Comandante
              </label>

              <label class="filter-chip">
                <input type="checkbox" class="gis-filter-area" data-area="Ferrovia" checked>
                Ferrovia
              </label>

              <label class="filter-chip">
                <input type="checkbox" class="gis-filter-area" data-area="Casa Verde / Escola Portuguesa" checked>
                Casa Verde / Escola Portuguesa
              </label>
            </div>

            <div class="filter-group">
              <h4>Legend</h4>

              <div class="map-legend" style="flex-direction:column;align-items:flex-start;gap:8px;">
                <div class="item">
                  <span class="dot" style="background:var(--color-success);"></span>
                  Complete
                </div>

                <div class="item">
                  <span class="dot" style="background:var(--color-warning);"></span>
                  In Progress
                </div>

                <div class="item">
                  <span class="dot" style="background:#F58232;"></span>
                  Mobilising
                </div>

                <div class="item">
                  <span class="dot" style="background:var(--color-critical);"></span>
                  Not Started
                </div>
              </div>
            </div>

            <button class="btn-primary" id="resetFiltersBtn" style="width:100%;justify-content:center;">
              <i class="fa-solid fa-rotate-left"></i>
              Reset Filters
            </button>

          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <div id="gisMap"></div>
          </div>
        </div>

      </div>

    </main>

    <footer style="text-align:center;padding:24px;color:var(--text-muted);font-size:12px;">
      PDISA-2 Lubango — Construction Progress Dashboard · Contract 44W3/LUBANGO/DNA/18
    </footer>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script src="js/main.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var mapElement = document.getElementById("gisMap");

    if (!mapElement || typeof L === "undefined") return;

    function cssVar(name, fallback) {
      var value = getComputedStyle(document.documentElement)
        .getPropertyValue(name)
        .trim();

      return value || fallback;
    }

    var successColor = cssVar("--color-success", "#1E8449");
    var warningColor = cssVar("--color-warning", "#B9770E");
    var primaryColor = cssVar("--color-primary", "#0A4595");
    var criticalColor = cssVar("--color-critical", "#C0392B");
    var mobilisingColor = "#F58232";

    var map = L.map(mapElement, {
      zoomControl: true,
      attributionControl: true
    }).setView([-14.9177, 13.4925], 12);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    var interventionAreas = [
      {
        name: "Mapunda",
        status: "notStarted",
        statusLabel: "Not Started",
        color: criticalColor,
        coords: [-14.8968, 13.4558]
      },
      {
        name: "Nambambe",
        status: "notStarted",
        statusLabel: "Not Started",
        color: criticalColor,
        coords: [-14.8725, 13.5356]
      },
      {
        name: "Bula Matadi",
        status: "notStarted",
        statusLabel: "Not Started",
        color: criticalColor,
        coords: [-14.9055, 13.5127]
      },
      {
        name: "Lubango Central",
        status: "progress",
        statusLabel: "In Progress",
        color: warningColor,
        coords: [-14.9177, 13.4925]
      },
      {
        name: "Comandante",
        status: "progress",
        statusLabel: "In Progress",
        color: warningColor,
        coords: [-14.9349, 13.4789]
      },
      {
        name: "Ferrovia",
        status: "mobilising",
        statusLabel: "Mobilising",
        color: mobilisingColor,
        coords: [-14.9484, 13.5098]
      },
      {
        name: "Casa Verde / Escola Portuguesa",
        status: "complete",
        statusLabel: "Complete",
        color: successColor,
        coords: [-14.9621, 13.4585]
      }
    ];

    var alignmentSegments = [
      {
        name: "Northern alignment",
        area: "Mapunda",
        status: "notStarted",
        statusLabel: "Not Started",
        color: criticalColor,
        coords: [
          [-14.8968, 13.4558],
          [-14.9055, 13.5127],
          [-14.8725, 13.5356]
        ]
      },
      {
        name: "Central alignment",
        area: "Lubango Central",
        status: "progress",
        statusLabel: "In Progress",
        color: warningColor,
        coords: [
          [-14.9177, 13.4925],
          [-14.9349, 13.4789],
          [-14.9484, 13.5098]
        ]
      },
      {
        name: "South-west alignment",
        area: "Casa Verde / Escola Portuguesa",
        status: "complete",
        statusLabel: "Complete",
        color: successColor,
        coords: [
          [-14.9349, 13.4789],
          [-14.9621, 13.4585]
        ]
      }
    ];

    var segmentLayers = alignmentSegments.map(function (segment) {
      var layer = L.polyline(segment.coords, {
        color: segment.color || primaryColor,
        weight: 5,
        opacity: 0.85,
        dashArray: segment.status === "progress" ? "8 7" : segment.status === "mobilising" ? "4 7" : null
      }).bindPopup(
        '<div class="gis-popup">' +
          '<strong>' + segment.name + '</strong>' +
          'Area: ' + segment.area + '<br>' +
          'Status: ' + segment.statusLabel +
        '</div>'
      );

      layer._status = segment.status;
      layer._area = segment.area;

      return layer.addTo(map);
    });

    var areaLayers = interventionAreas.map(function (area) {
      var marker = L.circleMarker(area.coords, {
        radius: 12,
        color: "#ffffff",
        weight: 2,
        fillColor: area.color,
        fillOpacity: 0.85
      }).bindPopup(
        '<div class="gis-popup">' +
          '<strong>' + area.name + '</strong>' +
          'Status: ' + area.statusLabel +
        '</div>'
      );

      marker._status = area.status;
      marker._area = area.name;

      return marker.addTo(map);
    });

    L.marker([-14.9177, 13.4925])
      .bindPopup("<strong>Lubango</strong><br>Project city center")
      .addTo(map);

    var bounds = L.latLngBounds(
      interventionAreas.map(function (area) {
        return area.coords;
      })
    );

    map.fitBounds(bounds.pad(0.25));

    function getCheckedValues(selector, dataKey) {
      return Array.from(document.querySelectorAll(selector + ":checked")).map(function (checkbox) {
        return checkbox.dataset[dataKey];
      });
    }

    function applyFilters() {
      var activeStatuses = getCheckedValues(".gis-filter-status", "status");
      var activeAreas = getCheckedValues(".gis-filter-area", "area");

      areaLayers.concat(segmentLayers).forEach(function (layer) {
        var visible =
          activeStatuses.indexOf(layer._status) !== -1 &&
          activeAreas.indexOf(layer._area) !== -1;

        if (visible && !map.hasLayer(layer)) {
          layer.addTo(map);
        }

        if (!visible && map.hasLayer(layer)) {
          map.removeLayer(layer);
        }
      });
    }

    document.querySelectorAll(".gis-filter-status, .gis-filter-area").forEach(function (checkbox) {
      checkbox.addEventListener("change", applyFilters);
    });

    var resetBtn = document.getElementById("resetFiltersBtn");

    if (resetBtn) {
      resetBtn.addEventListener("click", function () {
        document.querySelectorAll(".gis-filter-status, .gis-filter-area").forEach(function (checkbox) {
          checkbox.checked = true;
        });

        applyFilters();
      });
    }

    setTimeout(function () {
      map.invalidateSize();
    }, 300);
  });
</script>

</body>
</html>
